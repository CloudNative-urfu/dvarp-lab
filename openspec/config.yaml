schema: spec-driven

# Контекст проекта — показывается агенту при создании артефактов change.
context: |
  Проект: dvarp-lab — полигон проверки гипотез исследования (статья, USBEREIT/IEEE):
  защита СС «магазин возвратов» (refund support agent) под легальным и атакующим
  трафиком, сырые данные, метрики канона. Репозиторий единственный; код защиты
  перенесён из dvarp-prototype @ d5828df с малой адаптацией клея.

  Стек: Python 3.13 (uv), FastAPI, SQLAlchemy (SQLite — тесты/dev, PostgreSQL —
  прогоны), pytest. Сервисы общаются JSON по HTTP на локальных портах
  (shop 9411, traffic 9412, attack 9413, filter 9414, metrics 9415, ui 9410) —
  контракты в docs/api.md.

  Критичные инварианты — docs/agent-manual.md: барьер «только текст»,
  сбор ≠ расчёт, пин model_spec, append-only хеш-цепочки, парные прогоны,
  семантика сида, номинальная проверка вместо сетевой охраны.

  Ссылки на канон — FR-1.x/NFR-2.x из dvarp/docs/guardrails_requirements.md
  (перенесённый код защиты несёт их в docstring'ах). Ссылки на инварианты
  lab — по нумерации docs/agent-manual.md (1–10).

  Спецификации пишутся заново для lab и НЕ переносятся из dvarp-prototype:
  задачи другие, лишних спек нет.

  Стиль артефактов: тело (Why/What Changes/design/tasks) — на русском;
  заголовки требований и SHALL-формулировки — на английском;
  сценарии — WHEN/THEN.

rules:
  proposal:
    - Разделы: Why / What Changes / Capabilities / Impact.
    - Тело на русском; идентификаторы и пути — как в коде.
  tasks:
    - Задача добавляется в чеклист в коммите, где она сделана, и сразу
      отмечается [x] — чеклист растёт вместе с кодом.
  specs:
    - Каждое требование: заголовок с SHALL на английском, минимум один
      #### Scenario: с WHEN/THEN.
    - Внутри одного change имя требования уникально; новые коммиты добавляют
      новые секции ## ADDED Requirements, не переиспользуя имена.
