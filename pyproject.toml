[project]
name = "dvarp-lab"
version = "0.1.0"
description = "Полигон прогона гипотез исследования: СС, трафик, атака, сырьё, метрики"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.21",
  "asyncpg>=0.30",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.26", "ruff>=0.11"]

[build-system]
requires = []
build-backend = "uv"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["local-sources", "frozen"]

[tool.ruff.lint.per-file-ignores]
# Перенесённый защитный код прототипа: fail-closed except и dict-профили — намеренные.
"services/shop/guards/**" = ["BLE001", "RUF012"]
"services/shop/agent/**" = ["BLE001", "RUF012"]
# Перенесённые тесты прототипа: сохранены как есть (кроме путей импортов).
"tests/test_guard_contract.py" = ["RUF012", "B017", "ISC004"]
"tests/test_guard_plugins.py" = ["B017", "ISC004", "RUF059"]
"tests/test_guard_policy.py" = ["B017", "RUF059", "RUF012"]
"tests/test_executor.py" = ["RUF059"]
"tests/test_agent.py" = ["RUF059", "RUF015"]
"tests/test_configs.py" = ["RUF059", "RUF015"]
"tests/test_evaluator.py" = ["RUF059"]
"tests/test_tools.py" = ["RUF059"]
"tests/test_llm.py" = ["RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
